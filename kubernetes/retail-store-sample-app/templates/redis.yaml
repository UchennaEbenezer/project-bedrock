apiVersion: v1
kind: Service
metadata:
  name: checkout-redis
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: checkout
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: redis
      protocol: TCP
      name: redis
  selector:
    app.kubernetes.io/name: checkout
    app.kubernetes.io/component: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-redis
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: checkout
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: checkout
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: checkout
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: "public.ecr.aws/docker/library/redis:6.0-alpine"
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
