apiVersion: v1
kind: Secret
metadata:
  name: orders-rabbitmq
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  # RabbitMQ credentials can be empty/default for the sample app
---
apiVersion: v1
kind: Service
metadata:
  name: orders-rabbitmq
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: orders
    app.kubernetes.io/component: rabbitmq
spec:
  type: ClusterIP
  ports:
    - port: 5672
      targetPort: amqp
      protocol: TCP
      name: amqp
    - port: 15672
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: orders
    app.kubernetes.io/component: rabbitmq
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: orders-rabbitmq
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: orders
    app.kubernetes.io/component: rabbitmq
spec:
  replicas: 1
  serviceName: orders-rabbitmq
  selector:
    matchLabels:
      app.kubernetes.io/name: orders
      app.kubernetes.io/component: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders
        app.kubernetes.io/component: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: "public.ecr.aws/docker/library/rabbitmq:3-management"
          imagePullPolicy: IfNotPresent
          ports:
            - name: amqp
              containerPort: 5672
              protocol: TCP
            - name: http
              containerPort: 15672
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: "/var/lib/rabbitmq/mnesia"
      volumes:
        - name: data
          emptyDir: {}
